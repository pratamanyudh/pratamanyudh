name: Windows Utility Runner

on:
  workflow_dispatch:

jobs:
  runner-job:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Prepare Remote Access
        shell: powershell
        run: |
          # Enable Remote Desktop
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name "fDenyTSConnections" -Value 0

          # Keep secure authentication
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name "UserAuthentication" -Value 1

          # Enable default firewall rules
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

          Restart-Service TermService -Force

      - name: Setup Local Account
        shell: powershell
        run: |
          $username = "devuser"

          # Generate simple random password
          $chars = ([char[]](97..122)) + ([char[]](65..90)) + ([char[]](48..57))
          $password = -join ($chars | Get-Random -Count 10)

          $securePass = ConvertTo-SecureString $password -AsPlainText -Force

          New-LocalUser -Name $username -Password $securePass -AccountNeverExpires
          Add-LocalGroupMember -Group "Administrators" -Member $username
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member $username

          echo "R_USER=$username" >> $env:GITHUB_ENV
          echo "R_PASS=$password" >> $env:GITHUB_ENV

      - name: Install Network Tool
        shell: powershell
        run: |
          $url = "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi"
          $path = "$env:TEMP\net.msi"

          Invoke-WebRequest $url -OutFile $path
          Start-Process msiexec.exe -ArgumentList "/i `"$path`" /quiet /norestart" -Wait
          Remove-Item $path -Force

      - name: Initialize Network
        shell: powershell
        run: |
          $ts = "$env:ProgramFiles\Tailscale\tailscale.exe"

          & $ts up `
            --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} `
            --hostname=win-node-$env:GITHUB_RUN_ID

          Start-Sleep -Seconds 8

          $ip = & $ts ip -4

          if (-not $ip) {
            Write-Error "Failed to obtain IP"
            exit 1
          }

          echo "R_HOST=$ip" >> $env:GITHUB_ENV

      - name: Connection Info
        shell: powershell
        run: |
          Write-Host "=== ACCESS INFO ==="
          Write-Host "Host : $env:R_HOST"
          Write-Host "User : $env:R_USER"
          Write-Host "Pass : $env:R_PASS"
          Write-Host "==================="

      - name: Keep Session Alive
        shell: powershell
        run: |
          while ($true) {
            Start-Sleep -Seconds 300
          }
